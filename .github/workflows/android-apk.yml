name: Build Android APK offline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Capacitor project and offline game assets
        env:
          APP_ID: eu.design8s2.neonbubble
          APP_NAME: '8S2 Neon Bubble'
        run: |
          mkdir -p android-build/www
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name android-build -exec cp -a {} android-build/www/ \;
          cd android-build
          printf '%s\n' '{"private":true,"dependencies":{"@capacitor/core":"^7.4.0","@capacitor/android":"^7.4.0"},"devDependencies":{"@capacitor/cli":"^7.4.0"}}' > package.json
          npm install
          node -e 'const fs=require("fs");fs.writeFileSync("capacitor.config.json",JSON.stringify({appId:process.env.APP_ID,appName:process.env.APP_NAME,webDir:"www",server:{androidScheme:"https"}}))'
          npx cap add android
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const p=path.join('android','app','src','main','java',...process.env.APP_ID.split('.'),'MainActivity.java');
          fs.mkdirSync(path.dirname(p),{recursive:true});
          fs.writeFileSync(p,`package ${process.env.APP_ID};\nimport android.os.Bundle;\nimport android.view.View;\nimport com.getcapacitor.BridgeActivity;\npublic class MainActivity extends BridgeActivity {\n private void fullscreen(){getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);}\n @Override public void onCreate(Bundle b){super.onCreate(b);fullscreen();}\n @Override public void onWindowFocusChanged(boolean focused){super.onWindowFocusChanged(focused);if(focused)fullscreen();}\n}\n`);
          const manifest='android/app/src/main/AndroidManifest.xml';let m=fs.readFileSync(manifest,'utf8');m=m.replace(/android:name=".MainActivity"/, 'android:name="'+process.env.APP_ID+'.MainActivity"');fs.writeFileSync(manifest,m);
          NODE
      - name: Generate app icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('icon-face-512.png').convert('RGBA')
          root=Path('android-build/android/app/src/main/res')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=root/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              im=src.resize((size,size),Image.Resampling.LANCZOS)
              for name in ['ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png']:
                  im.save(folder/name)
          PY
      - name: Build installable APK
        run: cd android-build/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 8s2-neon-bubble-android-apk
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
