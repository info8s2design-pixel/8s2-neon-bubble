name: Build signed Android release APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Capacitor project and offline game assets
        env:
          APP_ID: eu.design8s2.neonbubble
          APP_NAME: '8S2 Neon Bubble'
        run: |
          mkdir -p android-build/www
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name android-build -exec cp -a {} android-build/www/ \;
          cd android-build
          printf '%s\n' '{"private":true,"dependencies":{"@capacitor/core":"^7.4.0","@capacitor/android":"^7.4.0"},"devDependencies":{"@capacitor/cli":"^7.4.0"}}' > package.json
          npm install
          node -e 'const fs=require("fs");fs.writeFileSync("capacitor.config.json",JSON.stringify({appId:process.env.APP_ID,appName:process.env.APP_NAME,webDir:"www",server:{androidScheme:"https"}}))'
          npx cap add android
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const p=path.join('android','app','src','main','java',...process.env.APP_ID.split('.'),'MainActivity.java');
          fs.mkdirSync(path.dirname(p),{recursive:true});
          fs.writeFileSync(p,`package ${process.env.APP_ID};\nimport android.os.Bundle;\nimport android.view.View;\nimport com.getcapacitor.BridgeActivity;\npublic class MainActivity extends BridgeActivity {\n private void fullscreen(){getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY|View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|View.SYSTEM_UI_FLAG_LAYOUT_STABLE|View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN|View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);}\n @Override public void onCreate(Bundle b){super.onCreate(b);fullscreen();}\n @Override public void onWindowFocusChanged(boolean focused){super.onWindowFocusChanged(focused);if(focused)fullscreen();}\n}\n`);
          const manifest='android/app/src/main/AndroidManifest.xml';let m=fs.readFileSync(manifest,'utf8');m=m.replace(/android:name=".MainActivity"/, 'android:name="'+process.env.APP_ID+'.MainActivity"');fs.writeFileSync(manifest,m);
          NODE
      - name: Generate app icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('icon-face-512.png').convert('RGBA')
          root=Path('android-build/android/app/src/main/res')
          for density,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder=root/f'mipmap-{density}'
              folder.mkdir(parents=True,exist_ok=True)
              im=src.resize((size,size),Image.Resampling.LANCZOS)
              for name in ['ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png']:
                  im.save(folder/name)
          PY
      - name: Check Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Configure ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Configure ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Configure ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Configure ANDROID_KEY_PASSWORD" && exit 1)
      - name: Restore keystore and configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android-build/android/app/8s2-release.jks
          node - <<'NODE'
          const fs=require('fs');
          const p='android-build/android/app/build.gradle';
          let s=fs.readFileSync(p,'utf8');
          s += `\nandroid {\n defaultConfig {\n  versionCode 100000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')\n  versionName '1.23'\n }\n signingConfigs {\n  release {\n   storeFile file('8s2-release.jks')\n   storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n   keyAlias System.getenv('ANDROID_KEY_ALIAS')\n   keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n  }\n }\n buildTypes {\n  release { signingConfig signingConfigs.release }\n }\n}\n`;
          fs.writeFileSync(p,s);
          NODE
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android-build/android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 8s2-neon-bubble-android-signed-release
          path: android-build/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
